name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify dependency sources and licenses
        run: npm run check:dependencies
      - run: npm run schemas
      - run: npm run licenses
      - name: Require current schemas and license notices
        run: git diff --exit-code -- docs/tool-schemas.json docs/dependency-inventory.json THIRD_PARTY_NOTICES.md third-party-licenses
      - run: npm run check:release
      - run: npm pack --dry-run --ignore-scripts
